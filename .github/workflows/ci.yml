name: CI

on:
  push:
    branches: [ main, ai-modernize ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Unified Build & Test Pipeline
  # ─────────────────────────────────────────────
  build_and_test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev zlib1g-dev build-essential clang llvm libbpf-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install bpftool (static)
        run: |
          curl -sSL https://github.com/libbpf/bpftool/releases/download/v7.4.0/bpftool-v7.4.0-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/bpftool /usr/local/bin/bpftool
          sudo chmod +x /usr/local/bin/bpftool

      - name: Install kernel headers
        run: |
          if [ ! -d "/lib/modules/$(uname -r)/build" ]; then
            sudo apt-get install -y linux-headers-$(uname -r) || sudo apt-get install -y linux-headers-azure || true
          fi

      - name: Generate vmlinux.h
        run: |
          mkdir -p bpf
          sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h

      - name: Compile eBPF program
        run: clang -g -O2 -target bpf -I bpf/ -c bpf/basset_hound.bpf.c -o bpf/basset_hound.bpf.o

      - name: Build kernel module
        run: make lkm

      - name: Check formatting
        run: cargo fmt --check

      - name: Build Rust binary
        run: cargo build --release

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests with loaded kernel module and eBPF
        run: |
          # Load the compiled kernel module
          sudo insmod basset_hound_module.ko
          # Run tests under sudo to allow eBPF loading and LKM netlink queries
          sudo env "PATH=$PATH" CI=true cargo test
          # Unload the module
          sudo rmmod basset_hound_module

  # ─────────────────────────────────────────────
  # Security: audit dependencies for known CVEs
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
