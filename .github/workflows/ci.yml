name: CI

on:
  push:
    branches: [ main, ai-modernize ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Rust userland: build, test, lint, format
  # ─────────────────────────────────────────────
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev zlib1g-dev


      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Create a dummy BPF object so build.rs succeeds without bpftool
      - name: Create dummy BPF object for build
        run: mkdir -p bpf && touch bpf/basset_hound.bpf.o

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  # ─────────────────────────────────────────────
  # LKM: compile the kernel module
  # ─────────────────────────────────────────────
  lkm:
    name: LKM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          # Attempt to install headers for the running kernel, with fallback to the Azure meta-package
          sudo apt-get install -y linux-headers-$(uname -r) || sudo apt-get install -y linux-headers-azure || true

      - name: Build kernel module
        run: make lkm

  # ─────────────────────────────────────────────
  # eBPF: compile BPF bytecode
  # ─────────────────────────────────────────────
  ebpf:
    name: eBPF Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          # Install clang, llvm, libbpf-dev, and standalone bpftool package
          sudo apt-get install -y clang llvm libbpf-dev bpftool

      - name: Generate vmlinux.h
        run: |
          mkdir -p bpf
          # Check PATH first, then linux-tools fallback path
          if command -v bpftool &>/dev/null; then
            BPFTOOL=bpftool
          elif [ -x "/usr/lib/linux-tools/$(uname -r)/bpftool" ]; then
            BPFTOOL="/usr/lib/linux-tools/$(uname -r)/bpftool"
          else
            # Try to locate any other bpftool binary
            BPFTOOL=$(find /usr -name bpftool -type f -executable -print -quit 2>/dev/null || echo "")
            if [ -z "$BPFTOOL" ]; then
              echo "Error: bpftool not found" && exit 1
            fi
          fi
          sudo $BPFTOOL btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h

      - name: Compile eBPF program
        run: clang -g -O2 -target bpf -I bpf/ -c bpf/basset_hound.bpf.c -o bpf/basset_hound.bpf.o

  # ─────────────────────────────────────────────
  # Security: audit dependencies for known CVEs
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
