name: CI

on:
  push:
    branches: [ main, ai-modernize ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CC_x86_64_unknown_linux_musl: musl-gcc
  LIBRARY_PATH: /tmp/musl-argp/lib
  C_INCLUDE_PATH: /tmp/musl-argp/include

jobs:
  # ─────────────────────────────────────────────
  # Unified Build & Test Pipeline
  # ─────────────────────────────────────────────
  build_and_test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev zlib1g-dev build-essential clang llvm libbpf-dev musl-tools musl-dev autopoint autoconf flex bison libtool

      - name: Build argp-standalone for musl
        run: |
          git clone --depth=1 https://github.com/ericonr/argp-standalone.git /tmp/argp-standalone
          cd /tmp/argp-standalone
          autoreconf -fi
          CC=musl-gcc ./configure --host=x86_64-linux-musl --prefix=/tmp/musl-argp
          make -j$(nproc)
          make install

      - name: Build musl-obstack for musl
        run: |
          git clone --depth=1 https://github.com/void-linux/musl-obstack.git /tmp/musl-obstack
          cd /tmp/musl-obstack
          autoreconf -fi
          CC=musl-gcc ./configure --host=x86_64-linux-musl --prefix=/tmp/musl-argp
          make -j$(nproc)
          make install

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Install bpftool (static)
        run: |
          curl -sSL https://github.com/libbpf/bpftool/releases/download/v7.4.0/bpftool-v7.4.0-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/bpftool /usr/local/bin/bpftool
          sudo chmod +x /usr/local/bin/bpftool

      - name: Install kernel headers
        run: |
          if [ ! -d "/lib/modules/$(uname -r)/build" ]; then
            sudo apt-get install -y linux-headers-$(uname -r) || sudo apt-get install -y linux-headers-azure || true
          fi

      - name: Generate vmlinux.h
        run: |
          mkdir -p bpf
          sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h

      - name: Compile eBPF program
        run: clang -g -O2 -target bpf -I bpf/ -c bpf/basset_hound.bpf.c -o bpf/basset_hound.bpf.o

      - name: Build kernel module
        run: make lkm

      - name: Check formatting
        run: cargo fmt --check

      - name: Build Rust binary (musl)
        run: cargo build --target x86_64-unknown-linux-musl --release

      - name: Run clippy (musl)
        run: cargo clippy --target x86_64-unknown-linux-musl -- -D warnings

      - name: Run tests with loaded kernel module and eBPF (musl)
        run: |
          # Load the compiled kernel module
          sudo insmod basset_hound_module.ko
          # Run tests under sudo with preserved environment variables for rustup/cargo
          sudo -E env "PATH=$PATH" CI=true cargo test --target x86_64-unknown-linux-musl
          # Unload the module
          sudo rmmod basset_hound_module

  # ─────────────────────────────────────────────
  # Security: audit dependencies for known CVEs
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
